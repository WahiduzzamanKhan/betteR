[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Steps run before each build; only Windows ARM64 needs any (see the file).
github-build-setup = "../build-setup.yml"

# Linux binaries are built against glibc 2.28 (AlmaLinux 8) so they also run on
# RHEL/Rocky/Alma 8 and 9 and Debian 11, not only on distributions as new as
# the runner. Windows ARM64 is built natively, like install.ps1, rather than
# cross-compiled. macOS Intel is cross-compiled on Apple silicon, since
# GitHub is retiring its Intel macOS runners.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-gnu" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-22.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-gnu" }

[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-11-arm"
x86_64-apple-darwin = "macos-15"
