[package]
name = "better"
version = "0.1.0"
edition = "2024"
description = "A modern R console for the terminal, with the ark R kernel built in"
license = "MIT"
repository = "https://github.com/WahiduzzamanKhan/betteR"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
ctrlc = "3.5.2"
dirs = "7.0.0"
hex = "0.4.3"
hmac = "0.13.0"
nu-ansi-term = "0.50.3"
reedline = "0.53.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tree-sitter = "0.24.7"
# tree-sitter and zmq link native libraries, so they must be the exact versions ark uses.
tree-sitter-r = { git = "https://github.com/r-lib/tree-sitter-r", rev = "d459b97a9a11dd81643ab674938bede2874663b0" }
uuid = { version = "1.29.2", features = ["v4"] }
zmq = { git = "https://github.com/erickt/rust-zmq", rev = "5d78967" }

# ark is built into the binary (`better --kernel`); pinned to one upstream commit.
ark = { git = "https://github.com/posit-dev/ark", rev = "042c3695d124e0d452e6fdcdd213ea87a5b179ad" }
amalthea = { git = "https://github.com/posit-dev/ark", rev = "042c3695d124e0d452e6fdcdd213ea87a5b179ad" }
streaming-iterator = "0.1.9"
unicode-width = "0.2.3"
