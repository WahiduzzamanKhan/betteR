name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      - uses: astral-sh/setup-uv@v10.4.0

      - name: End-to-end tests (PTY)
        if: runner.os != 'Windows'
        run: uv run --with pexpect python tests/pty_smoke.py

      # The same tests in a ConPTY, the pseudo-console Windows Terminal uses.
      - name: End-to-end tests (ConPTY)
        if: runner.os == 'Windows'
        run: uv run --with pywinpty python tests/pty_smoke.py target/debug/better.exe

      # Without a PTY: piped input runs through a whole session (kernel start,
      # execute, shutdown). Checks that R runs in UTF-8, which needs the
      # application manifest embedded in better.exe, and that non-ASCII
      # input arrives as one character and prints back intact.
      - name: Piped session (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out=$(printf '%s\n' \
            'cat("utf8:", l10n_info()[["UTF-8"]], "\n")' \
            'x <- "é"; cat("chars:", nchar(x), utf8ToInt(x), x, "\n")' \
            | ./target/debug/better.exe)
          echo "$out"
          grep -qF "utf8: TRUE" <<<"$out"
          grep -qF "chars: 1 233 é" <<<"$out"

      - name: Kernel logs
        if: failure() && runner.os != 'Windows'
        run: |
          for f in "${TMPDIR:-/tmp}"/better-*/ark.log; do
            [ -f "$f" ] && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; }
          done
          true

      - name: Kernel logs (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem $env:TEMP -Directory -Filter 'better-*' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'ark.log' } |
            Where-Object { Test-Path $_ } |
            ForEach-Object { "::group::$_"; Get-Content $_; "::endgroup::" }
