name: Release smoke test

# Installs a published release the way a user would (the install scripts
# attached to the GitHub Release, no Rust needed) and runs R through it.
# Runs after the Release workflow (release.yml, generated by dist) succeeds for
# a pushed tag, or by hand for any release tag. (Not as a dist custom job:
# dist 0.34.0 generates `uses: $/.github/...` for those, which GitHub rejects.)
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test, e.g. v0.2.0
        required: true
        type: string

env:
  # For a tag push, the Release run's head_branch is the tag.
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  # One clean runner per release binary, with R from setup-r.
  runner:
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS Intel runs natively on macos-15-intel; ARM64 Linux and
        # Windows on their ARM runners.
        os: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-11-arm]
        r: [release, oldrel-1]
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - name: Install better and run R (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # A CARGO_HOME of its own, with the runner's Rust off PATH, so only
          # the installer can put `better` there.
          export CARGO_HOME="$RUNNER_TEMP/cargo"
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v '\.cargo/bin' | paste -sd: -)"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/better-installer.sh" | sh
          better="$CARGO_HOME/bin/better"
          "$better" --version | tee version.txt
          grep -qx "better ${TAG#v}" version.txt
          out=$(printf 'cat(R.version.string, "\\n")\n1 + 1\n' | "$better")
          echo "$out"
          grep -qF '[1] 2' <<<"$out"
          if [ "$RUNNER_OS" = macOS ]; then
            vtool -show-build "$better"
          else
            echo "Highest glibc symbol needed: $(objdump -T "$better" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          fi

      - name: Install better and run R (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CARGO_HOME = Join-Path $env:RUNNER_TEMP 'cargo'
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch '\\\.cargo\\bin' }) -join ';'
          irm "https://github.com/${{ github.repository }}/releases/download/$env:TAG/better-installer.ps1" | iex
          $better = Join-Path $env:CARGO_HOME 'bin\better.exe'
          $version = & $better --version
          $version
          if ($version -ne "better $($env:TAG.TrimStart('v'))") { throw "unexpected version: $version" }
          $out = "cat(R.version.string, `"\n`")`n1 + 1`n" | & $better | Out-String
          $out
          if (-not $out.Contains('[1] 2')) { throw '1 + 1 did not print [1] 2' }

  # The x64 Linux binary on the major distributions, each with its own R.
  linux-distro:
    name: ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's own R is 4.1, and ark needs R >= 4.2, so R comes
          # from CRAN's Ubuntu repository, as it must for users there.
          - image: ubuntu:22.04
            setup: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl xz-utils ca-certificates gnupg &&
              curl -fsSL https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/cran.gpg &&
              echo "deb https://cloud.r-project.org/bin/linux/ubuntu jammy-cran40/" > /etc/apt/sources.list.d/cran.list &&
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y r-base-core
          - image: ubuntu:24.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl xz-utils r-base-core
          - image: debian:12
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl xz-utils r-base-core
          - image: fedora:latest
            setup: dnf install -y xz tar R-core
          - image: rockylinux/rockylinux:8
            setup: dnf install -y epel-release dnf-plugins-core && dnf config-manager --set-enabled powertools && dnf install -y xz tar R-core
          - image: rockylinux/rockylinux:9
            setup: dnf install -y epel-release dnf-plugins-core && dnf config-manager --set-enabled crb && dnf install -y xz tar R-core
          # `which`: R's utils package runs it when loading (Sys.which); a
          # normal openSUSE install has it, the container image doesn't.
          - image: opensuse/tumbleweed
            setup: zypper --non-interactive install curl xz tar gzip which R-base
          - image: archlinux:latest
            setup: pacman -Syu --noconfirm curl xz tar r
    steps:
      - name: Install R
        run: ${{ matrix.setup }}

      - name: Install better and run R
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/better-installer.sh" | sh
          better="$HOME/.cargo/bin/better"
          "$better" --version
          grep -h PRETTY_NAME /etc/os-release
          ldd --version | sed -n 1p  # not head: with pipefail, ldd would die of SIGPIPE
          out=$(printf 'cat(R.version.string, "\\n")\n1 + 1\n' | "$better")
          echo "$out"
          grep -qF '[1] 2' <<<"$out"
